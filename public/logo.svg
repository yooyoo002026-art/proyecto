<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="naranja" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="fondo-icono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a22"/>
      <stop offset="100%" style="stop-color:#0f0f12"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo ícono -->
  <rect x="0" y="8" width="64" height="64" rx="14" fill="url(#fondo-icono)"/>
  <rect x="0" y="8" width="64" height="64" rx="14" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.6"/>

  <!-- Velocímetro - arco base -->
  <path d="M 10 54 A 22 22 0 0 1 54 54" fill="none" stroke="#2e2e3e" stroke-width="5" stroke-linecap="round"/>

  <!-- Velocímetro - arco progreso naranja -->
  <path d="M 10 54 A 22 22 0 0 1 42 26" fill="none" stroke="url(#naranja)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Marcas del velocímetro -->
  <line x1="10" y1="54" x2="13" y2="50" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="38" x2="19" y2="41" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="30" x2="32" y2="34" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="38" x2="45" y2="41" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="54" x2="51" y2="50" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Aguja del velocímetro -->
  <line x1="32" y1="54" x2="44" y2="28" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Centro de la aguja -->
  <circle cx="32" cy="54" r="4" fill="#f97316"/>
  <circle cx="32" cy="54" r="2" fill="#0f0f12"/>

  <!-- Punto brillante en la aguja -->
  <circle cx="42" cy="30" r="2.5" fill="#f97316" opacity="0.9" filter="url(#glow)"/>

  <!-- TEXTO: Control Total -->
  <text x="80" y="38" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Control Total</text>

  <!-- TEXTO: CONDUCTOR -->
  <text x="80" y="60" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="400" fill="#f97316" letter-spacing="3">CONDUCTOR</text>

  <!-- Línea decorativa bajo el texto -->
  <line x1="80" y1="65" x2="310" y2="65" stroke="#f97316" stroke-width="1" opacity="0.3"/>
</svg>
